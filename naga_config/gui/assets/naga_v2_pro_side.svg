<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 220 470" width="220" height="470">
  <!-- Naga V2 Pro, linke Seite (Daumenseite), Vorderseite oben. Eigene Zeichnung.
       Platzhalter @..@ werden zur Laufzeit durch Theme-/Palettenfarben ersetzt (mouse_scene.themed_svg);
       @HOT:<id>@ ist die Deckkraft der grünen Hervorhebung einer Taste. -->
  <defs>
    <linearGradient id="g_body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="@BODY_A@"/>
      <stop offset="0.55" stop-color="@BODY_B@"/>
      <stop offset="1" stop-color="@BODY_A@"/>
    </linearGradient>
    <linearGradient id="g_shell" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="@BODY_B@"/>
      <stop offset="0.7" stop-color="@BODY_C@"/>
      <stop offset="1" stop-color="@BODY_A@"/>
    </linearGradient>
    <linearGradient id="g_plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="@BODY_A@"/>
      <stop offset="1" stop-color="@BODY_D@"/>
    </linearGradient>
    <linearGradient id="g_key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="@KEY_A@"/>
      <stop offset="1" stop-color="@KEY_B@"/>
    </linearGradient>
    <radialGradient id="g_shine" cx="150" cy="250" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g_wheel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="@BODY_D@"/>
      <stop offset="1" stop-color="@BODY_C@"/>
    </linearGradient>
  </defs>

  <!-- @BASE@: 1, or 0 for the keys-only layer drawn above the leader lines -->
  <g opacity="@BASE@">
  <!-- cable / USB-C plug at the front -->
  <path d="M84 0 C84 10 82 18 80 26" fill="none" stroke="@BODY_C@" stroke-width="7" stroke-linecap="round"/>
  <rect x="71" y="22" width="18" height="16" rx="4" fill="@BODY_D@" stroke="@EDGE@" stroke-width="1"/>

  <!-- scroll wheel edge and the two top buttons peeking over the top profile -->
  <circle cx="160" cy="98" r="30" fill="none" stroke="@ACC@" stroke-opacity="0.25" stroke-width="6"/>
  <circle cx="160" cy="98" r="30" fill="url(#g_wheel)" stroke="@ACC@" stroke-width="2"/>
  <g stroke="@BODY_A@" stroke-width="2" stroke-linecap="round">
    <path d="M187 86 L181 88 M190 98 L183 98 M187 110 L181 108 M182 120 L177 117 M182 76 L177 79"/>
  </g>
  <path d="M174 140 C184 138 190 144 190 151 C190 156 186 159 180 160 Z" fill="@BODY_C@" stroke="@EDGE@" stroke-width="1"/>
  <path d="M178 166 C188 164 194 170 194 177 C194 182 190 185 184 186 Z" fill="@BODY_C@" stroke="@EDGE@" stroke-width="1"/>

  <!-- body silhouette: base on the left, long palm hump on the right -->
  <path d="M32 70 C30 50 46 34 80 30 C112 26 138 28 152 40
           C164 52 170 80 175 108 C182 160 200 214 201 268
           C202 320 194 372 168 410 C146 442 108 456 76 455
           C50 454 34 444 31 420 C27 330 27 170 32 70 Z"
        fill="url(#g_body)" stroke="@EDGE@" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- top shell (main button flank + palm) -->
  <path d="M80 30 C112 26 138 28 152 40 C164 52 170 80 175 108 C182 160 200 214 201 268
           C202 320 194 372 168 410 C146 442 108 456 76 455
           C112 440 150 404 166 352 C178 312 180 262 176 212 C172 160 162 110 150 78 C140 52 116 36 80 30 Z"
        fill="url(#g_shell)"/>
  <path d="M152 40 C164 52 170 80 175 108 C182 160 200 214 201 268 C202 320 194 372 168 410"
        fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.6"/>
  <!-- seam between click button and palm -->
  <path d="M146 86 C158 104 170 150 180 204 C186 212 194 214 200 214" fill="none" stroke="@BODY_A@" stroke-width="1.6"/>
  <path d="M32 70 C30 50 46 34 80 30 C112 26 138 28 152 40
           C164 52 170 80 175 108 C182 160 200 214 201 268
           C202 320 194 372 168 410 C146 442 108 456 76 455
           C50 454 34 444 31 420 C27 330 27 170 32 70 Z" fill="url(#g_shine)"/>
  <!-- lower shell / base strip -->
  <path d="M40 76 C36 170 36 330 40 418" fill="none" stroke="@BODY_A@" stroke-width="2"/>
  <path d="M42 76 C38 170 38 330 42 418" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  </g>
  <!-- thumb plate with the 12-button grid -->
  <g transform="rotate(-5 104 228)">
    <g opacity="@BASE@">
    <rect x="36" y="114" width="137" height="200" rx="20" fill="url(#g_plate)" stroke="@EDGE@" stroke-width="1.5"/>
    <rect x="39" y="117" width="131" height="194" rx="18" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="1.5"/>
    </g>
    <g font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="@KEY_TXT@">
    <g id="side_1">
      <rect x="46" y="128" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="46" y="128" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="49" y="130.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="46" y="128" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_1@"/>
      <text x="62.5" y="151.5">1</text>
    </g>
    <g id="side_2">
      <rect x="85" y="132" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="85" y="132" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="88" y="134.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="85" y="132" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_2@"/>
      <text x="101.5" y="155.5">2</text>
    </g>
    <g id="side_3">
      <rect x="124" y="128" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="124" y="128" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="127" y="130.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="124" y="128" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_3@"/>
      <text x="140.5" y="151.5">3</text>
    </g>
    <g id="side_4">
      <rect x="46" y="171" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="46" y="171" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="49" y="173.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="46" y="171" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_4@"/>
      <text x="62.5" y="194.5">4</text>
    </g>
    <g id="side_5">
      <rect x="85" y="175" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="85" y="175" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="88" y="177.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="85" y="175" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_5@"/>
      <text x="101.5" y="198.5">5</text>
    </g>
    <g id="side_6">
      <rect x="124" y="171" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="124" y="171" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="127" y="173.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="124" y="171" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_6@"/>
      <text x="140.5" y="194.5">6</text>
    </g>
    <g id="side_7">
      <rect x="46" y="214" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="46" y="214" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="49" y="216.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="46" y="214" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_7@"/>
      <text x="62.5" y="237.5">7</text>
    </g>
    <g id="side_8">
      <rect x="85" y="218" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="85" y="218" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="88" y="220.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="85" y="218" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_8@"/>
      <text x="101.5" y="241.5">8</text>
    </g>
    <g id="side_9">
      <rect x="124" y="214" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="124" y="214" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="127" y="216.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="124" y="214" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_9@"/>
      <text x="140.5" y="237.5">9</text>
    </g>
    <g id="side_10">
      <rect x="46" y="257" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="46" y="257" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="49" y="259.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="46" y="257" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_10@"/>
      <text x="62.5" y="280.5">10</text>
    </g>
    <g id="side_11">
      <rect x="85" y="261" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="85" y="261" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="88" y="263.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="85" y="261" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_11@"/>
      <text x="101.5" y="284.5">11</text>
    </g>
    <g id="side_12">
      <rect x="124" y="257" width="33" height="37" rx="7" fill="none" stroke="@ACC@" stroke-opacity="0.22" stroke-width="5"/>
      <rect x="124" y="257" width="33" height="37" rx="7" fill="url(#g_key)" stroke="@ACC@" stroke-width="1.6"/>
      <rect x="127" y="259.5" width="27" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="124" y="257" width="33" height="37" rx="7" fill="@ACC@" fill-opacity="@HOT:side_12@"/>
      <text x="140.5" y="280.5">12</text>
    </g>
    </g>
  </g>
  <!-- thumb rest below the plate -->
  <g opacity="@BASE@">
  <path d="M46 330 C80 342 128 342 160 330" fill="none" stroke="@BODY_A@" stroke-width="1.6"/>
  <path d="M46 332 C80 344 128 344 160 332" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  </g>
</svg>
