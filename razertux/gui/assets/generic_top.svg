<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 340" width="200" height="340">
  <!-- Generic mouse from above, front at the top. Own line drawing for the laser look
       (stroke only, @ACC@ = line colour, key groups with exactly one shape).
       The wheel sits behind the two buttons so a label line can reach it without crossing a key. -->
  <path d="M100 8 C60 8 34 30 30 80 C26 140 22 210 30 262 C38 312 66 332 100 332 C134 332 162 312 170 262 C178 210 174 140 170 80 C166 30 140 8 100 8 Z" stroke="@ACC@" stroke-width="2.2"/>
  <g id="left"><path d="M96 16 C66 16 46 34 40 66 L39 86 C60 92 80 92 96 88 Z" stroke="@ACC@" stroke-width="1.4"/></g>
  <g id="right"><path d="M104 16 C134 16 154 34 160 66 L161 86 C140 92 120 92 104 88 Z" stroke="@ACC@" stroke-width="1.4"/></g>
  <g id="wheel"><rect x="89" y="102" width="22" height="56" rx="10" stroke="@ACC@" stroke-width="1.6"/></g>
</svg>
