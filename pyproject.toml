[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naga-config"
version = "0.1.0"
description = "Linux replacement for Razer Synapse for the Razer Naga V2 Pro"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = ["evdev", "pyudev", "dbus-next", "PySide6"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
naga-config = "naga_config.cli:main"
naga-configd = "naga_config.daemon.main:main"
naga-config-gui = "naga_config.gui.app:main"

[tool.setuptools.packages.find]
include = ["naga_config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
