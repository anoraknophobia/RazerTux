[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "razertux"
version = "0.8.0"
description = "Unofficial Linux replacement for Razer Synapse (Razer Naga V2 Pro and other Razer mice); not affiliated with Razer Inc."
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = ["evdev", "pyudev", "dbus-next", "PySide6"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
razertux = "razertux.cli:main"
razertuxd = "razertux.daemon.main:main"
razertux-gui = "razertux.gui.app:main"
razertux-record = "razertux.gui.recorder_wizard:main"

[tool.setuptools.packages.find]
include = ["razertux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
"razertux.gui" = ["assets/*.svg", "assets/layouts/*.json"]
"razertux.devices" = ["openrazer_mice.json", "openrazer_other.json"]
"razertux.i18n" = ["*.json"]
