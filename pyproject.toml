[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "naga-config"
version = "0.1.0"
description = "Linux replacement for Razer Synapse for the Razer Naga V2 Pro"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = ["evdev", "pyudev", "dbus-next", "PySide6"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
naga-config = "razertux.cli:main"
naga-configd = "razertux.daemon.main:main"
naga-config-gui = "razertux.gui.app:main"

[tool.setuptools.packages.find]
include = ["razertux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
"razertux.gui" = ["assets/*.svg"]
"razertux.i18n" = ["*.json"]
