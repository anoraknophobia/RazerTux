[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "razertux"
version = "0.2.2"
description = "Unofficial Linux replacement for Razer Synapse (Razer Naga V2 Pro); not affiliated with Razer Inc."
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = ["evdev", "pyudev", "dbus-next", "PySide6"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
razertux = "razertux.cli:main"
razertuxd = "razertux.daemon.main:main"
razertux-gui = "razertux.gui.app:main"

[tool.setuptools.packages.find]
include = ["razertux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
"razertux.gui" = ["assets/*.svg"]
"razertux.i18n" = ["*.json"]
