name: Device report
description: Report a Razer device recorded with the RazerTux device recorder
title: "[device] "
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping RazerTux support more devices. The report was generated by the in-app
        recorder and contains no serial numbers, MAC addresses, host names or user names.
        Please check the JSON below before submitting.
  - type: input
    id: device
    attributes:
      label: Device
      description: Model name, USB ID and connection type.
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Human readable summary produced by the recorder.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report (JSON)
      description: Paste the full JSON from the recorder if it did not fit into the prefilled form.
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything else we should know (what worked, what did not).
